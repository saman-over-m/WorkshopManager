name: Workshop Manager - Windows Test

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check JavaScript
        run: npm run check

      - name: Rebuild native SQLite module
        run: npm run rebuild

      - name: Run Electron smoke test
        run: npm test
